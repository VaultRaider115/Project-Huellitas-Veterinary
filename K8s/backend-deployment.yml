apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # El workflow de despliegue reemplaza esta etiqueta por el SHA del commit.
          image: ghcr.io/nightmare115117/devops-proyect:latest
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            # Orígenes permitidos por CORS. Sin esto el backend usa localhost y
            # rechaza con 403 el POST /usuario/login que llega desde el dominio.
            - name: APP_CORS_ALLOWED_ORIGINS
              value: https://derivevaultraider115.studio,https://dev-server.tail223158.ts.net

            # TEMPORAL: vuelve al comportamiento anterior (Hibernate crea lo que
            # falte, incluida la tabla `Cita-Servicio`). Cuando la migración esté
            # aplicada, cambiar a "validate" otra vez.
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseZGC
                -XX:+ZGenerational
                -XX:MaxRAMPercentage=70.0
                -Xlog:gc*:file=/tmp/gc.log:time,uptime

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://mariadb:3306/huellitas_db

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: DB_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: DB_PASSWORD

            - name: AES_SECRET
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: AES_SECRET

            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: HMAC_SECRET

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: JWT_SECRET

            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: huellitas-secrets
                  key: TURNSTILE_SECRET

            - name: TURNSTILE_EXPECTED_HOSTNAMES
              value: dev-server.tail223158.ts.net,derivevaultraider115.studio

      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
