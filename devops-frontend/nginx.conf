server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  # Métodos de diagnóstico no permitidos.
  if ($request_method = TRACE) {
    return 405;
  }
  if ($request_method = TRACK) {
    return 405;
  }

  include /etc/nginx/snippets/security-headers.conf;

  location /huellitas/api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;

    rewrite ^/huellitas/api/(.*)$ /$1 break;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # El proxy sobrescribe las cabeceras del cliente: no se confía en X-Forwarded-* entrantes.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
  }

  location /huellitas/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /huellitas/index.html;
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;

    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}
