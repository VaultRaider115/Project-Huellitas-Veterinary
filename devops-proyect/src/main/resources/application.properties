# Configuración base de la aplicación.
# No contiene credenciales: los secretos se inyectan por variables de entorno
# o por el archivo .env local (no versionado).
spring.application.name=devops-proyect
server.port=${SERVER_PORT:8080}

# Archivo .env opcional para desarrollo local. En producción use variables de entorno.
spring.config.import=optional:file:.env[.properties]

# Base de datos. Sin contraseña por defecto: la aplicación falla de forma segura
# si no se configura una credencial válida.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/huellitas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:huellitas}
# Sin valor por defecto: la aplicación falla al arrancar si no hay credencial.
# El perfil local puede usar una contraseña vacía solo para desarrollo.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Fail-closed: nunca modificar el esquema automáticamente salvo en el perfil local.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# CORS restringido a orígenes explícitos.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# CAPTCHA Turnstile.
app.security.turnstile.enabled=${TURNSTILE_ENABLED:false}
app.security.turnstile.secret=${TURNSTILE_SECRET:}
app.security.turnstile.expected-hostnames=${TURNSTILE_EXPECTED_HOSTNAMES:}

# Límite de intentos por cuenta (login y MFA).
app.security.attempts.max=${APP_SECURITY_ATTEMPTS_MAX:5}
app.security.attempts.lockout-minutes=${APP_SECURITY_ATTEMPTS_LOCKOUT_MINUTES:15}

# Nunca devolver mensajes, trazas ni datos internos en errores HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Actuator: solo salud, sin detalles ni endpoints de diagnóstico.
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=env,beans,heapdump,threaddump,configprops,mappings,loggers
management.endpoint.health.show-details=never
