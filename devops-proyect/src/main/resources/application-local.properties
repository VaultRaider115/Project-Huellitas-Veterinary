# Perfil exclusivo para desarrollo local.
# Permite que Hibernate cree/actualice el esquema en una base de datos local.
# Nunca active este perfil en producción.
spring.jpa.hibernate.ddl-auto=update
app.security.turnstile.enabled=false
# Solo en desarrollo se tolera una contraseña vacía para una base local.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
