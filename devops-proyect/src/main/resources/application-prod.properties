# Perfil de producción: todos los valores sensibles son obligatorios.
# La aplicación falla al arrancar si falta una variable, en lugar de usar valores inseguros.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Lo define la variable de entorno del despliegue; por defecto solo valida.
# Con SPRING_JPA_HIBERNATE_DDL_AUTO=update Hibernate crea el esquema que falte.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Cabeceras reenviadas por el proxy inverso (nginx) con IP real y esquema.
server.forward-headers-strategy=native

# CAPTCHA obligatorio en producción.
app.security.turnstile.enabled=true
app.security.turnstile.secret=${TURNSTILE_SECRET}
app.security.turnstile.expected-hostnames=${TURNSTILE_EXPECTED_HOSTNAMES}

# Solo se expone el endpoint de salud para sondas de Kubernetes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Errores sin detalles internos.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
