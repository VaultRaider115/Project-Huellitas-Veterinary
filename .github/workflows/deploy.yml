name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Convertir owner a minúsculas
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verificar clave pública de Turnstile
        env:
          TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error::Configura la variable de repositorio VITE_TURNSTILE_SITE_KEY."
            exit 1
          fi

      - name: Build y Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./devops-frontend
          push: true
          # Etiqueta inmutable por commit además de latest para desarrollo.
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/devops-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/devops-frontend:latest
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Convertir owner a minúsculas
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./devops-proyect
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/devops-proyect:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/devops-proyect:latest
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Convertir owner a minúsculas
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Configurar Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/Dev-Server.pem
          chmod 400 ~/.ssh/Dev-Server.pem
          ssh-keyscan "${{ secrets.SSH_IP }}" >> ~/.ssh/known_hosts

      - name: Copiar manifiestos de Kubernetes
        run: |
          scp -i ~/.ssh/Dev-Server.pem \
            K8s/mariadb-deployment.yml \
            K8s/backend-deployment.yml \
            K8s/frontend-deployment.yml \
            "${{ secrets.SSH_HOST_NAME }}@${{ secrets.SSH_IP }}:~/K8s/"

      - name: Aplicar configuración de Kubernetes
        run: |
          ssh -i ~/.ssh/Dev-Server.pem \
            "${{ secrets.SSH_HOST_NAME }}@${{ secrets.SSH_IP }}" "
              export KUBECONFIG=/home/iron/.kube/config &&
              cd ~/K8s &&
              kubectl apply -f mariadb-deployment.yml &&
              kubectl apply -f backend-deployment.yml &&
              kubectl apply -f frontend-deployment.yml
            "

      - name: Desplegar imágenes inmutables por SHA
        run: |
          ssh -i ~/.ssh/Dev-Server.pem \
            "${{ secrets.SSH_HOST_NAME }}@${{ secrets.SSH_IP }}" "
              export KUBECONFIG=/home/iron/.kube/config &&
              kubectl set image deployment/backend \
                backend=ghcr.io/${{ env.OWNER_LC }}/devops-proyect:${{ github.sha }} &&
              kubectl set image deployment/frontend \
                frontend=ghcr.io/${{ env.OWNER_LC }}/devops-frontend:${{ github.sha }}
            "

      - name: Esperar aplicaciones
        run: |
          ssh -i ~/.ssh/Dev-Server.pem \
            "${{ secrets.SSH_HOST_NAME }}@${{ secrets.SSH_IP }}" "
              export KUBECONFIG=/home/iron/.kube/config &&
              kubectl rollout status deployment/backend --timeout=300s &&
              kubectl rollout status deployment/frontend --timeout=120s
            "
