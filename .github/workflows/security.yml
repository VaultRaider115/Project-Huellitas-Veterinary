name: Security Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    # Cada lunes a las 06:00 UTC, para detectar vulnerabilidades nuevas.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: 🛡️ Dependencias, secretos y configuración
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔎 Escanear repositorio con Trivy
        # El tag publicado lleva prefijo "v": sin él la acción no se puede resolver.
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: 📋 Reporte SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: ⬆️ Subir resultados a GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
